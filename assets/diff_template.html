<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diff View</title>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      background: #f9fafb;
      color: #111827;
      height: 100vh;
      overflow: hidden;
    }

    #container {
      display: flex;
      height: 100vh;
      gap: 0;
      overflow: hidden;
    }

    .pane {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }

    #baseline-pane {
      border-right: 2px solid #d1d5db;
    }

    .pane-header {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
    }

    h3 {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-top: 20px;
      margin-bottom: 8px;
      padding: 6px 8px;
      background: #f3f4f6;
      border-radius: 4px;
      border-left: 3px solid #d1d5db;
    }

    p {
      line-height: 1.6;
      color: #374151;
      margin-bottom: 8px;
    }

    /* ── Diff highlight classes ─────────────────────────────────────────────── */

    .diff-item {
      border-radius: 3px;
      cursor: pointer;
      transition: filter 0.1s ease;
    }

    .diff-block {
      display: block;
      margin: 8px 0 12px;
      padding: 10px 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-left: 4px solid #9ca3af;
      border-radius: 6px;
    }

    .doc-block {
      margin: 8px 0 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .doc-line {
      margin: 4px 0;
      padding: 4px 6px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .doc-table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 8px 0 14px;
    }

    .doc-table-wrap table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.55);
      font-size: 13px;
    }

    .doc-table-wrap th,
    .doc-table-wrap td {
      border: 1px solid #d1d5db;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
      line-height: 1.6;
    }

    .doc-table-wrap th {
      background: rgba(243, 244, 246, 0.9);
      font-weight: 600;
    }

    .diff-row {
      border-left: 4px solid #9ca3af;
    }

    .diff-token {
      background: #fde68a;
      color: #78350f;
      border-radius: 3px;
      padding: 0 2px;
    }

    .diff-item:hover {
      filter: brightness(0.88);
    }

    .diff-item.selected {
      outline: 2px solid #2563eb;
      outline-offset: 1px;
    }

    /* 新增 — green */
    .added {
      border-left-color: #4a9e72;
    }

    /* 删减 — red */
    .deleted {
      border-left-color: #c05050;
    }

    /* 微调 — yellow */
    .minor {
      border-left-color: #b09830;
    }

    /* 实质修改 — orange */
    .major {
      border-left-color: #c07840;
    }

    /* 重写 — purple */
    .rewrite {
      border-left-color: #7a58c0;
    }

    /* 格式变化 — gray */
    .format {
      border-left-color: #9ca3af;
    }

    .diff-block p {
      margin: 0 0 8px;
    }

    .diff-block p:last-child {
      margin-bottom: 0;
    }

    .diff-block h4,
    .diff-block h5,
    .diff-block h6 {
      color: #1f2937;
      margin: 0 0 8px;
      font-weight: 600;
      line-height: 1.5;
    }

    .diff-block h4 { font-size: 15px; }
    .diff-block h5 { font-size: 14px; }
    .diff-block h6 { font-size: 13px; }

    .diff-block ul,
    .diff-block ol {
      margin: 4px 0 8px 20px;
      padding-left: 12px;
    }

    .diff-block li {
      margin: 2px 0;
    }

    .diff-block blockquote {
      margin: 6px 0;
      padding: 4px 10px;
      color: #4b5563;
      border-left: 3px solid #9ca3af;
      background: rgba(156, 163, 175, 0.12);
    }

    .diff-block code {
      font-family: Consolas, 'SFMono-Regular', monospace;
      font-size: 12px;
      background: rgba(17, 24, 39, 0.08);
      border-radius: 3px;
      padding: 1px 4px;
    }

    .diff-block pre {
      margin: 6px 0;
      padding: 8px 10px;
      overflow-x: auto;
      background: rgba(17, 24, 39, 0.08);
      border-radius: 4px;
    }

    .markdown-table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 6px 0;
    }

    .markdown-table-wrap table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.55);
      font-size: 13px;
    }

    .markdown-table-wrap th,
    .markdown-table-wrap td {
      border: 1px solid #d1d5db;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    .markdown-table-wrap th {
      background: rgba(243, 244, 246, 0.9);
      font-weight: 600;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #9ca3af;
      font-size: 13px;
    }

    .empty-state .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    /* ── Dark mode (body.dark toggled from Python) ──────────────────────────── */

    body.dark {
      background: #1e1e2e;
      color: #cdd6f4;
    }

    body.dark .pane {
      background: #414559;
      border-color: #45475a;
    }

    body.dark #baseline-pane {
      border-right-color: #585b70;
    }

    body.dark .pane-header {
      color: #a6adc8;
      border-bottom-color: #45475a;
      background: #414559;
    }

    body.dark h3 {
      color: #74c7ec;
      background: #232634;
      border-left-color: #45475a;
    }

    body.dark p {
      color: #cdd6f4;
    }

    body.dark .diff-block {
      background: #363a4f;
      border-color: #585b70;
    }

    body.dark .doc-table-wrap table {
      background: rgba(30, 30, 46, 0.35);
    }

    body.dark .doc-table-wrap th,
    body.dark .doc-table-wrap td {
      border-color: #585b70;
    }

    body.dark .doc-table-wrap th {
      background: rgba(35, 38, 52, 0.75);
    }

    body.dark .diff-token {
      background: #f9e2af;
      color: #11111b;
    }

    body.dark .added    { border-left-color: #74c7ec; }
    body.dark .deleted  { border-left-color: #f38ba8; }
    body.dark .minor    { border-left-color: #f9e2af; }
    body.dark .major    { border-left-color: #fab387; }
    body.dark .rewrite  { border-left-color: #cba6f7; }
    body.dark .format   { border-left-color: #a6adc8; }

    body.dark .diff-block h4,
    body.dark .diff-block h5,
    body.dark .diff-block h6 {
      color: #cdd6f4;
    }

    body.dark .diff-block blockquote {
      color: #bac2de;
      background: rgba(166, 173, 200, 0.12);
      border-left-color: #6c7086;
    }

    body.dark .diff-block code,
    body.dark .diff-block pre {
      background: rgba(17, 17, 27, 0.45);
    }

    body.dark .markdown-table-wrap table {
      background: rgba(30, 30, 46, 0.35);
    }

    body.dark .markdown-table-wrap th,
    body.dark .markdown-table-wrap td {
      border-color: #585b70;
    }

    body.dark .markdown-table-wrap th {
      background: rgba(35, 38, 52, 0.75);
    }

    body.dark .empty-state { color: #6c7086; }

    body.dark .diff-item.selected { outline-color: #89b4fa; }
  </style>
</head>
<body>
  <div id="container">
    <div class="pane" id="baseline-pane">
      <div class="pane-header">基准文档</div>
      <div id="baseline-content">
        <div class="empty-state">
          <div class="icon">&#128196;</div>
          <div>请选择版本并运行对比</div>
        </div>
      </div>
    </div>

    <div class="pane" id="target-pane">
      <div class="pane-header">目标文档</div>
      <div id="target-content">
        <div class="empty-state">
          <div class="icon">&#128196;</div>
          <div>请选择版本并运行对比</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var scrollSyncInProgress = false;
      var scrollSyncPaused = false;
      var scrollSyncPauseTimer = null;

      function schedulePaneScrollSyncResume() {
        if (scrollSyncPauseTimer !== null) {
          window.clearTimeout(scrollSyncPauseTimer);
        }
        scrollSyncPauseTimer = window.setTimeout(function () {
          scrollSyncPaused = false;
          scrollSyncPauseTimer = null;
        }, 120);
      }

      function pausePaneScrollSync() {
        scrollSyncPaused = true;
        schedulePaneScrollSyncResume();
      }

      function maximumScrollTop(pane) {
        return Math.max(0, pane.scrollHeight - pane.clientHeight);
      }

      function syncPaneScroll(sourcePane, targetPane) {
        if (scrollSyncPaused) {
          schedulePaneScrollSyncResume();
          return;
        }
        if (scrollSyncInProgress) {
          return;
        }

        var sourceMaximum = maximumScrollTop(sourcePane);
        var targetMaximum = maximumScrollTop(targetPane);
        var progress = sourceMaximum > 0
          ? sourcePane.scrollTop / sourceMaximum
          : 0;

        scrollSyncInProgress = true;
        targetPane.scrollTop = progress * targetMaximum;
        window.requestAnimationFrame(function () {
          scrollSyncInProgress = false;
        });
      }

      function attachPaneScrollSync() {
        var baselinePane = document.getElementById('baseline-pane');
        var targetPane = document.getElementById('target-pane');

        baselinePane.addEventListener('scroll', function () {
          syncPaneScroll(baselinePane, targetPane);
        });
        targetPane.addEventListener('scroll', function () {
          syncPaneScroll(targetPane, baselinePane);
        });
      }

      function resetDiffPaneScroll() {
        document.getElementById('baseline-pane').scrollTop = 0;
        document.getElementById('target-pane').scrollTop = 0;
      }

      function matchingDiffElements(diffId) {
        var matches = [];
        document.querySelectorAll('.diff-item').forEach(function (el) {
          if (el.getAttribute('data-diff-id') === diffId) {
            matches.push(el);
          }
        });
        return matches;
      }

      function selectDiff(diffId) {
        document.querySelectorAll('.diff-item.selected').forEach(function (s) {
          s.classList.remove('selected');
        });

        var matches = matchingDiffElements(diffId);
        matches.forEach(function (s) {
          s.classList.add('selected');
        });
        return matches;
      }

      function focusDiff(diffId) {
        var matches = selectDiff(diffId);
        pausePaneScrollSync();
        ['baseline-pane', 'target-pane'].forEach(function (paneId) {
          var pane = document.getElementById(paneId);
          var target = null;
          matches.forEach(function (el) {
            if (!target && pane && pane.contains(el)) {
              target = el;
            }
          });
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      }

      /**
       * Attach click handlers to all .diff-item elements.
       * Called from Python via page.runJavaScript() after injecting HTML.
       */
      function attachDiffHandlers() {
        document.querySelectorAll('.diff-item').forEach(function (el) {
          // Avoid double-binding by removing existing listener first
          el.removeEventListener('click', el._diffClickHandler);
          el._diffClickHandler = function () {
            var diffId = el.getAttribute('data-diff-id');

            // Notify Python bridge
            if (diffId && window.bridge) {
              window.bridge.onDiffClick(diffId);
            }

            focusDiff(diffId);
          };
          el.addEventListener('click', el._diffClickHandler);
        });
      }

      // Expose globally so Python runJavaScript can call it
      window.attachDiffHandlers = attachDiffHandlers;
      window.focusDiff = focusDiff;
      window.selectDiff = selectDiff;
      window.resetDiffPaneScroll = resetDiffPaneScroll;

      attachPaneScrollSync();

      // Initialize QWebChannel bridge when the transport is available
      if (typeof qt !== 'undefined' && qt.webChannelTransport) {
        new QWebChannel(qt.webChannelTransport, function (channel) {
          window.bridge = channel.objects.bridge;
        });
      }
    })();
  </script>
</body>
</html>
